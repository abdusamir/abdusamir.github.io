/* ------------------------------------------------- arabic geometric pattern */
const STAR8 = (() => {
  const s = 64, c = s / 2, r = 13;
  const sq = (rot) => {
    const pts = [0, 1, 2, 3].map((i) => {
      const a = (Math.PI / 2) * i + rot;
      return `${(c + r * Math.SQRT2 * Math.cos(a)).toFixed(2)},${(c + r * Math.SQRT2 * Math.sin(a)).toFixed(2)}`;
    });
    return `<polygon points='${pts.join(" ")}'/>`;
  };
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${s}' height='${s}'><g fill='none' stroke='%23E9B85C' stroke-width='.8'>${sq(Math.PI / 4)}${sq(0)}<path d='M0 0L${c - 18} ${c - 18}M${s} 0L${c + 18} ${c - 18}M0 ${s}L${c - 18} ${c + 18}M${s} ${s}L${c + 18} ${c + 18}'/></g></svg>`;
  return `url("data:image/svg+xml;utf8,${svg}")`;
})();
const Pattern = ({ opacity = 0.05, sx }) => html`<${Box} aria-hidden="true" sx=${{ position: "absolute", inset: 0, backgroundImage: STAR8,

function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function buildCity() {
  const r = rng(1987), G = 250, parts = [], wins = [];
  let x = 330;
  while (x < 1210) {
    const w = 22 + Math.floor(r() * 40), h = 40 + Math.floor(r() * 120);
    if (x > 735 && x < 800) { x = 812; continue; }               // room for the tower
    const roll = r();
    if (roll < 0.14 && x < 1120) {                                  // mosque: dome + minarets
      const bw = 70, bh = 46;
      parts.push(`<rect x="${x}" y="${G - bh}" width="${bw}" height="${bh}"/>`);
      parts.push(`<path d="M${x + 12} ${G - bh} A23 26 0 0 1 ${x + bw - 12} ${G - bh} Z"/>`);
      parts.push(`<rect x="${x + bw / 2 - 1}" y="${G - bh - 34}" width="2" height="9"/>`);
      [x - 7, x + bw + 1].forEach((mx) => {
        parts.push(`<rect x="${mx}" y="${G - 112}" width="6" height="112"/>`);
        parts.push(`<rect x="${mx - 2}" y="${G - 86}" width="10" height="4"/>`);
        parts.push(`<path d="M${mx} ${G - 112} L${mx + 3} ${G - 128} L${mx + 6} ${G - 112} Z"/>`);
      });
      x += bw + 14; continue;
    }
    parts.push(`<rect x="${x}" y="${G - h}" width="${w}" height="${h}"/>`);
    if (r() < 0.25) parts.push(`<rect x="${x + w / 2 - 0.75}" y="${G - h - 14}" width="1.5" height="14"/>`);
    for (let wy = G - h + 8; wy < G - 8; wy += 10)
      for (let wx = x + 5; wx < x + w - 6; wx += 8)
        if (r() < 0.16) wins.push([wx, wy, (2 + r() * 6).toFixed(1), (r() * 6).toFixed(1)]);
    x += w + 2 + Math.floor(r() * 4);
  }
  // Cairo Tower: slim lattice shaft with a flared lantern top
  const tx = 772;
  parts.push(`<path d="M${tx - 9} ${G} L${tx - 5} ${G - 170} L${tx + 5} ${G - 170} L${tx + 9} ${G} Z"/>`);
  parts.push(`<path d="M${tx - 14} ${G - 170} L${tx + 14} ${G - 170} L${tx + 10} ${G - 192} L${tx - 10} ${G - 192} Z"/>`);
  parts.push(`<rect x="${tx - 1}" y="${G - 222}" width="2" height="30"/>`);
  wins.push([tx - 7, G - 184, "3", "0.4"], [tx + 3, G - 184, "4", "1.2"], [tx - 2, G - 184, "5", "2.1"]);
  return { city: parts.join(""), wins };
}

function buildSky() {
  const r = rng(42), stars = [];
  for (let i = 0; i < 90; i++) stars.push([r() * 1200, r() * 175, 0.5 + r() * 1.3, (2 + r() * 4).toFixed(1), (r() * 5).toFixed(1)]);
  const nodes = [[110, 60], [235, 28], [380, 74], [520, 36], [655, 92], [905, 40], [1040, 82], [1135, 30]];
  const edges = [[0, 1], [1, 2], [2, 3], [3, 4], [2, 4], [4, 5], [5, 6], [6, 7], [5, 7], [3, 5]];
  return { stars, nodes, edges };
}

      ${sky.edges.map((_, i) => html`<circle key=${"m" + i} className="msg" r="1.9" fill=${C.gold}>
        <animateMotion dur=${(3 + (i % 3)) + "s"} begin=${"-" + (i * 0.7) + "s"} repeatCount="indefinite" keyPoints=${i % 2 ? "1;0" : "0;1"} keyTimes="0;1" calcMode="linear">
          <mpath href=${"#edge" + i} /></animateMotion></circle>`)}
      ${sky.nodes.map(([x, y], i) => html`<g key=${"n" + i}><circle cx=${x} cy=${y} r="6" fill=${C.gold} opacity=".12" /><circle cx=${x} cy=${y} r="2.4" fill=${C.goldSoft} /></g>`)}

      <g fill="#1A2152" opacity=".9">
        <path d=${`M40 ${G} L82 212 L124 ${G} Z`} />

        <path d=${`M205 ${G} L262 196 L319 ${G} Z`} />
      </g>

      ${wins.map(([x, y, d, delay], i) => html`<rect key=${"w" + i} className="win" x=${x} y=${y} width="3" height="4" rx=".5" fill=${C.gold}
        style=${{ "--d": d + "s", "--delay": delay + "s" }} />`)}

      <g mask="url(#reflMask)" transform=${`translate(0 ${2 * G}) scale(1 -1)`} fill=${C.gold}><use href="#cityShape" opacity=".5" /></g>
      ${[[120, 262, 160], [420, 274, 220], [700, 266, 140], [930, 280, 200], [1030, 262, 90]].map(([x, y, w], i) =>
        html`<rect key=${"r" + i} className="ripple" x=${x} y=${y} width=${w} height="1.2" rx=".6" fill=${C.goldSoft} style=${{ "--delay": i * 0.9 + "s" }} />`)}
    <//>`;
}

/* ------------------------------------------------------------ small pieces */
function CairoClock() {
  const fmt = useMemo(() => new Intl.DateTimeFormat("en-GB", { timeZone: "Africa/Cairo", hour: "2-digit", minute: "2-digit" }), []);
  const [t, setT] = useState(() => fmt.format(new Date()));
  useEffect(() => { const id = setInterval(() => setT(fmt.format(new Date())), 15000); return () => clearInterval(id); }, [fmt]);
  return html`<span>${t}</span>`;
}

const Kicker = ({ children, sx, className }) => html`<${Typography} component="div" className=${className} sx=${{ fontFamily: mono, fontSize: 13, color: "primary.main", letterSpacing: ".04em", ...sx }}>${children}<//>`;

const SECRETS = {

  "bears beets": "Bears. Beets. Backend systems.",
  "family business": "Saving people, hunting bugs. The family business.",
  "that's what she said": "…about the 15,000-row key collision.",

  "praise the sun": "\\[T]/  Bonfire lit. Progress saved.",
  "sudo hire abdulrahman": "Permission granted. Opening your mail client…",
};

function Palette({ open, onClose, onToast, onCopy }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  useEffect(() => { if (open) { setQ(""); setSel(0); } }, [open]);
  const go = (h) => { onClose(); setTimeout(() => { const el = document.querySelector(h); el && el.scrollIntoView({ behavior: "smooth" }); }, 120); };
  const cmds = [
    ...SECTIONS.map(([l, h]) => ({ label: "Go to " + l.toLowerCase(), hint: h, run: () => go(h) })),
    { label: "Email Abdulrahman", hint: "mailto", run: () => { onClose(); location.href = "mailto:" + EMAIL; } },
    { label: "Copy email address", hint: "clipboard", run: () => { onClose(); onCopy(); } },
    { label: "Open LinkedIn", hint: "↗", run: () => { onClose(); window.open(LINKEDIN, "_blank", "noopener"); } },
    { label: "Open GitHub", hint: "↗", run: () => { onClose(); window.open(GITHUB, "_blank", "noopener"); } },
  ];
  const key = q.trim().toLowerCase().replace(/[’]/g, "'");
  const list = cmds.filter((c) => c.label.toLowerCase().includes(key));
  const submit = () => {
    if (SECRETS[key]) {
      onClose(); onToast(SECRETS[key]);
      if (key === "sudo hire abdulrahman") setTimeout(() => { location.href = "mailto:" + EMAIL + "?subject=Let's%20talk"; }, 900);
      return;
    }
    if (list[sel]) list[sel].run();
  };
  return html`
    <${Dialog} open=${open} onClose=${onClose} fullWidth maxWidth="sm"
      PaperProps=${{ sx: { bgcolor: C.night2, border: `1px solid ${alpha(C.gold, 0.35)}`, borderRadius: 4, m: 2, width: "calc(100% - 32px)", alignSelf: "flex-start", mt: "12vh" } }}>
      <${Box} component="form" onSubmit=${(e) => { e.preventDefault(); submit(); }}
        sx=${{ display: "flex", alignItems: "center", gap: 1.5, px: 2.5, py: 1.75, borderBottom: `1px solid ${C.line}` }}>
        <${Typography} sx=${{ fontFamily: mono, color: "primary.main" }}>❯<//>
        <${InputBase} autoFocus fullWidth placeholder="type a command… (some are secret)" value=${q}
          onChange=${(e) => { setQ(e.target.value); setSel(0); }}
          onKeyDown=${(e) => {
            if (e.key === "ArrowDown") { e.preventDefault(); setSel((s) => Math.min(s + 1, list.length - 1)); }
            if (e.key === "ArrowUp") { e.preventDefault(); setSel((s) => Math.max(s - 1, 0)); }
          }}
          inputProps=${{ "aria-label": "Command", autoCapitalize: "none", autoCorrect: "off", spellCheck: false, enterKeyHint: "go" }}
          sx=${{ fontFamily: mono, fontSize: 16, color: "text.primary" }} />
      <//>
      <${List} dense sx=${{ py: 1, maxHeight: 340, overflowY: "auto" }}>
        ${list.length === 0 && html`<${Typography} sx=${{ px: 3, py: 2, fontFamily: mono, fontSize: 13, color: "text.secondary" }}>
          no command found. press enter anyway. you never know.<//>`}
        ${list.map((c, i) => html`
          <${ListItemButton} key=${c.label} selected=${i === sel} onClick=${c.run} onMouseEnter=${() => setSel(i)}
            sx=${{ mx: 1, borderRadius: 2, "&.Mui-selected": { bgcolor: alpha(C.gold, 0.12) } }}>
            <${ListItemText} primary=${c.label} primaryTypographyProps=${{ fontWeight: 600 }} />
            <${Typography} sx=${{ fontFamily: mono, fontSize: 12, color: "text.secondary" }}>${c.hint}<//>
          <//>`)}
      <//>
    <//>`;
}

  if (!show) return null;
  return html`
    <${Box} aria-live="polite" sx=${{ position: "fixed", inset: 0, zIndex: 2000, display: "grid", placeItems: "center", pointerEvents: "none",
      background: `linear-gradient(transparent 30%, ${alpha("#000", 0.75)} 45%, ${alpha("#000", 0.75)} 55%, transparent 70%)` }}>
      <${Typography} sx=${{ fontFamily: serif, fontSize: { xs: 44, md: 88 }, color: C.goldSoft, textShadow: `0 0 30px ${alpha(C.gold, 0.8)}`,
        animation: "felled 3.2s ease forwards", textAlign: "center", px: 2 }}>BUG FELLED<//>
    <//>`;
}

/* ------------------------------------------------------------------ app */
function App() {
  const [palette, setPalette] = useState(false);
  const [toast, setToast] = useState(null);
  const [felled, setFelled] = useState(false);
  const copy = useCallback(() => {
    const done = () => setToast("Email copied. A raven is on standby.");
    navigator.clipboard ? navigator.clipboard.writeText(EMAIL).then(done, done) : done();
  }, []);

  useEffect(() => {
    const seq = ["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];
    let pos = 0;
    const onKey = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const k = (e.key || "").toLowerCase();
      if ((k === "/" || (k === "k" && (e.metaKey || e.ctrlKey))) && tag !== "input" && tag !== "textarea") {
        e.preventDefault(); setPalette(true); return;
      }
      pos = k === seq[pos] ? pos + 1 : (k === seq[0] ? 1 : 0);
      if (pos === seq.length) { pos = 0; setFelled(true); setTimeout(() => setFelled(false), 3300); }
    };
    window.addEventListener("keydown", onKey);
    console.log("%cCurious? Good.%c\nPress / on the page. Some commands aren't listed.", "color:#E9B85C;font:700 18px sans-serif", "color:#A3ABC8;font:13px monospace");
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return html`
    <${ThemeProvider} theme=${theme}>
      <${CssBaseline} />
      <${Nav} onPalette=${() => setPalette(true)} />
      <${Hero} />
      <main>
        <${About} />
        <${Cases} />
        <${Quests} />
        <${Projects} />
        <${Inventory} />
      </main>
      <${Contact} onCopy=${copy} />
      <${Box} component="footer" sx=${{ py: 4, borderTop: `1px solid ${C.line}`, bgcolor: C.night }}>
        <${Container} maxWidth="lg">
          <${Stack} direction=${{ xs: "column", sm: "row" }} justifyContent="space-between" sx=${{ gap: 1 }}>
            <${Typography} variant="body2" color="text.secondary">© ${new Date().getFullYear()} Abdulrahman Ahmed · Cairo, Egypt<//>
            <${Typography} component="button" onClick=${() => setPalette(true)} variant="body2"
              sx=${{ fontFamily: mono, color: "text.secondary", cursor: "pointer", background: "none", border: 0, p: 0, textAlign: "left" }}>
              psst. press <${Box} component="span" sx=${{ color: "primary.main" }}>/<//> (or tap here)
            <//>
          <//>
        <//>
      <//>
      <${Palette} open=${palette} onClose=${() => setPalette(false)} onToast=${setToast} onCopy=${copy} />
      <${Felled} show=${felled} />
      <${Snackbar} open=${!!toast} autoHideDuration=${3400} onClose=${() => setToast(null)} anchorOrigin=${{ vertical: "bottom", horizontal: "center" }}>
        <${Alert} severity="info" variant="filled" icon=${false} onClose=${() => setToast(null)}
          sx=${{ bgcolor: C.surface, color: "text.primary", border: `1px solid ${alpha(C.gold, 0.5)}`, fontFamily: mono, fontSize: 13 }}>${toast}<//>
      <//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
