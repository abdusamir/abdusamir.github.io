            <${AccordionDetails} sx=${{ px: { xs: 2, md: 3.5 }, pb: 3.5, pl: { sm: 10.5 } }}>
              <${Grid} container spacing=${3}>
                ${c.blocks.map(([h, t]) => html`
                  <${Grid} item xs=${12} sm=${6} key=${h}>
                    <${Typography} variant="overline" color="primary">${h}<//>
                    <${Typography} sx=${{ mt: 0.5 }}>${t}<//>
                  <//>`)}
              <//>
              <${Stack} direction="row" spacing=${1} sx=${{ mt: 3, flexWrap: "wrap", rowGap: 1 }}>

            <//>
          <//>`)}
      <//>
    <//>`;
}

function Path() {
  const Dot = ({ active }) => html`<${Box} sx=${{ width: 14, height: 14, borderRadius: "50%", ml: "5px",
    bgcolor: active ? "secondary.main" : "background.default", border: 2, borderColor: active ? "secondary.main" : "text.secondary" }} />`;
  return html`
    <${Box} component="section" id="path" sx=${{ py: { xs: 8, md: 12 }, bgcolor: "background.paper", borderBlock: 1, borderColor: "divider" }}>
      <${Container} maxWidth="lg">
        <${Grid} container spacing=${6}>
          <${Grid} item xs=${12} md=${4}>
            <${SectionHead} n="02" kicker="path" title="Where I've been">
              Three companies, one thread: backends with real traffic, from enterprise clients to a consumer app.
            <//>
          <//>
          <${Grid} item xs=${12} md=${8}>
            <${Stepper} orientation="vertical" connector=${null} sx=${{ "& .MuiStepContent-root": { borderColor: "divider", ml: "11px" } }}>
              ${JOBS.map((j, i) => html`
                <${Step} key=${j.org} active=${true} expanded=${true}>
                  <${StepLabel} StepIconComponent=${() => html`<${Dot} active=${i === 0} />`}>
                    <${Stack} direction=${{ xs: "column", sm: "row" }} justifyContent="space-between" alignItems=${{ sm: "baseline" }} sx=${{ gap: 0.5 }}>
                      <${Box}>
                        <${Typography} variant="h6" sx=${{ fontSize: 22, lineHeight: 1.2 }}>${j.org}<//>
                        <${Typography} variant="body2" color="text.secondary">${j.role} · ${j.where}<//>
                      <//>
                      <${Typography} sx=${{ fontFamily: mono, fontSize: 13 }} color="text.secondary">${j.when}<//>
                    <//>
                  <//>
                  <${StepContent} TransitionProps=${{ in: true }}>
                    <${Typography} sx=${{ pb: 4, pt: 1, maxWidth: 620 }}>${j.text}<//>
                  <//>
                <//>`)}
            <//>
          <//>
        <//>
      <//>
    <//>`;
}

function Projects() {
  const [kind, setKind] = useState("all");
  const shown = PROJECTS.filter((p) => kind === "all" || p.kind === kind);
  return html`
    <${Container} maxWidth="lg" id="projects" component="section" sx=${{ py: { xs: 8, md: 12 } }}>
      <${Stack} direction=${{ xs: "column", md: "row" }} justifyContent="space-between" alignItems=${{ md: "flex-end" }} sx=${{ mb: { xs: 4, md: 6 }, gap: 3 }}>
        <${Box} sx=${{ mb: -6 }}><${SectionHead} n="03" kicker="side projects" title="Things I built for fun or for a grade" /><//>
        <${ToggleButtonGroup} size="small" exclusive value=${kind} onChange=${(_, v) => v && setKind(v)} aria-label="Filter projects">
          <${ToggleButton} value="all">All<//>
          <${ToggleButton} value="systems">Systems<//>
          <${ToggleButton} value="web">Web & AI<//>
        <//>
      <//>
      <${Grid} container spacing=${2.5}>
        ${shown.map((p, i) => html`
          <${Grid} item xs=${12} sm=${6} md=${4} key=${p.title}>
            <${Card} sx=${{ height: "100%", display: "flex", flexDirection: "column", transition: "transform .2s, border-color .2s",
                "&:hover": { transform: "translateY(-4px)", borderColor: "primary.main" } }}>
              <${CardContent} sx=${{ flexGrow: 1, p: 3 }}>
                <${Typography} sx=${{ fontFamily: serif, fontStyle: "italic", fontSize: 40, lineHeight: 1, color: "secondary.main", mb: 2 }}>${String(i + 1).padStart(2, "0")}<//>
                <${Typography} variant="h6" sx=${{ fontSize: 21, lineHeight: 1.25, mb: 1.25 }}>${p.title}<//>
                <${Typography} variant="body2" color="text.secondary" sx=${{ fontSize: 15 }}>${p.text}<//>
              <//>
              <${CardActions} sx=${{ px: 3, pb: 2.5, justifyContent: "space-between", flexWrap: "wrap", gap: 1 }}>
                <${Stack} direction="row" spacing=${0.75} sx=${{ flexWrap: "wrap", rowGap: 0.75 }}>
                  ${p.stack.map((s) => html`<${Chip} key=${s} label=${s} size="small" />`)}
                <//>
                ${p.url && html`<${Button} size="small" href=${p.url} target="_blank" rel="noopener" endIcon=${html`<${ArrowIcon} fontSize="small" />`}>Code<//>`}
              <//>
            <//>
          <//>`)}
      <//>
    <//>`;
}

function Toolbox() {
  return html`
    <${Container} maxWidth="lg" component="section" sx=${{ pb: { xs: 8, md: 12 } }}>
      <${SectionHead} n="04" kicker="toolbox" title="What I reach for" />
      <${Stack} divider=${html`<${Divider} flexItem />`} spacing=${3}>
        ${TOOLBOX.map(([tier, items], i) => html`
          <${Grid} container spacing=${2} key=${tier} alignItems="baseline">
            <${Grid} item xs=${12} md=${3}>
              <${Typography} variant="h6" sx=${{ fontStyle: "italic", fontWeight: 500 }}>${tier}<//>
            <//>
            <${Grid} item xs=${12} md=${9}>
              <${Stack} direction="row" sx=${{ flexWrap: "wrap", gap: 1 }}>
                ${items.map((s) => html`<${Chip} key=${s} label=${s} color=${i === 0 ? "primary" : "default"} variant=${i === 0 ? "filled" : "outlined"} />`)}
              <//>
            <//>
          <//>`)}
      <//>
    <//>`;
}

function Contact({ onCopy }) {
  return html`
    <${Box} component="section" id="contact" sx=${{ bgcolor: "primary.main", color: "primary.contrastText", py: { xs: 9, md: 14 } }}>
      <${Container} maxWidth="lg">
        <${Typography} variant="overline" sx=${{ opacity: 0.8 }}>05 · contact<//>
        <${Typography} variant="h1" sx=${{ fontSize: { xs: 52, md: 96 }, mt: 1 }}>
          Let's <${Box} component="span" sx=${{ fontStyle: "italic", fontWeight: 400 }}>talk.<//>
        <//>
        <${Typography} sx=${{ mt: 3, fontSize: 19, maxWidth: 560, opacity: 0.9 }}>
          I'm open to backend roles, remote or with relocation to Europe or the Gulf. Email is the fastest way to reach me.
        <//>
        <${Stack} direction=${{ xs: "column", sm: "row" }} spacing=${1.5} sx=${{ mt: 5 }} alignItems=${{ sm: "center" }}>
          <${Button} variant="contained" size="large" href=${"mailto:" + EMAIL} startIcon=${html`<${MailIcon} />`}
            sx=${{ bgcolor: "background.default", color: "text.primary", "&:hover": { bgcolor: "background.paper" }, textTransform: "none", overflowWrap: "anywhere" }}>${EMAIL}<//>
          <${Tooltip} title="Copy email">
            <${IconButton} onClick=${onCopy} aria-label="Copy email" sx=${{ color: "inherit", border: 1, borderColor: "currentColor", alignSelf: { xs: "flex-start", sm: "center" } }}><${CopyIcon} fontSize="small" /><//>
          <//>
        <//>
        <${Stack} direction="row" spacing=${3} sx=${{ mt: 4 }}>
          <${Link} href=${LINKEDIN} target="_blank" rel="noopener" color="inherit" underline="hover">LinkedIn ↗<//>
          <${Link} href=${GITHUB} target="_blank" rel="noopener" color="inherit" underline="hover">GitHub ↗<//>
        <//>
      <//>
    <//>`;
}

function App() {
  const prefersDark = useMediaQuery("(prefers-color-scheme: dark)");
  const [mode, setMode] = useState(() => { try { return localStorage.getItem("mode"); } catch (e) { return null; } });
  const effective = mode || (prefersDark ? "dark" : "light");
  const theme = useMemo(() => makeTheme(effective), [effective]);
  const [copied, setCopied] = useState(false);
  const toggle = () => { const m = effective === "dark" ? "light" : "dark"; setMode(m); try { localStorage.setItem("mode", m); } catch (e) {} };
  const copy = () => { (navigator.clipboard ? navigator.clipboard.writeText(EMAIL) : Promise.reject()).then(() => setCopied(true), () => setCopied(true)); };

  useEffect(() => {
    const r = document.documentElement.style, p = theme.palette;
    r.setProperty("--flow", p.secondary.main);
    r.setProperty("--node", p.background.default);
    r.setProperty("--node-on", p.primary.main);
    r.setProperty("--node-on-text", p.primary.contrastText);
  }, [theme]);

  return html`
    <${ThemeProvider} theme=${theme}>
      <${CssBaseline} />
      <${Box} sx=${{
        backgroundImage: (t) => `radial-gradient(${alpha(t.palette.text.primary, 0.09)} 1px, transparent 1px)`,
        backgroundSize: "22px 22px", minHeight: "100vh" }}>
        <${Nav} mode=${effective} toggle=${toggle} />
        <${Hero} />
        <${Box} sx=${{ bgcolor: "background.default" }}>
          <${Cases} />
          <${Path} />
          <${Projects} />
          <${Toolbox} />
        <//>
        <${Contact} onCopy=${copy} />
        <${Box} component="footer" sx=${{ bgcolor: "background.default", py: 4 }}>
          <${Container} maxWidth="lg">
            <${Stack} direction=${{ xs: "column", sm: "row" }} justifyContent="space-between" sx=${{ gap: 1 }}>
              <${Typography} variant="body2" color="text.secondary">© ${new Date().getFullYear()} Abdelrahman Ahmed · Cairo, Egypt<//>
              <${Typography} variant="body2" color="text.secondary" sx=${{ fontFamily: mono }}>React + Material UI<//>
            <//>
          <//>
        <//>
      <//>
      <${Snackbar} open=${copied} autoHideDuration=${2200} onClose=${() => setCopied(false)} anchorOrigin=${{ vertical: "bottom", horizontal: "center" }}>
        <${Alert} severity="success" variant="filled" onClose=${() => setCopied(false)}>Email copied<//>
      <//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
