const SECRETS = {
  "say my name": "Abdulrahman Ahmed. You're goddamn right.",
  "i am the danger": "No. I am the one who gets paged at 3am.",
  "tread lightly": "Tread lightly. This is production.",
  "yeah science": "Yeah, science! (Computer science, technically.)",
  "better call saul": "Wrong lawyer. Better call Abdul.",
  "bears beets": "Bears. Beets. Backend systems.",
  "family business": "Saving people, hunting bugs. The family business.",
  "that's what she said": "…about the 15,000-row key collision.",
  "thats what she said": "…about the 15,000-row key collision.",
  "praise the sun": "\\[T]/  Bonfire lit. Progress saved.",
  "git blame": "It was me. I fixed it, though.",
  "sudo hire abdulrahman": "Permission granted. Opening your mail client…",
};

function Palette({ open, onClose, onToast, onCopy }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  useEffect(() => { if (open) { setQ(""); setSel(0); } }, [open]);
  const go = (h) => { onClose(); setTimeout(() => { const el = document.querySelector(h); el && el.scrollIntoView({ behavior: "smooth" }); }, 120); };
  const cmds = [
    ...SECTIONS.map(([l, h]) => ({ label: "Go to " + l.toLowerCase(), hint: h, run: () => go(h) })),
    { label: "Email Abdulrahman", hint: "mailto", run: () => { onClose(); location.href = "mailto:" + EMAIL; } },
    { label: "Copy email address", hint: "clipboard", run: () => { onClose(); onCopy(); } },
    { label: "Open LinkedIn", hint: "↗", run: () => { onClose(); window.open(LINKEDIN, "_blank", "noopener"); } },
    { label: "Open GitHub", hint: "↗", run: () => { onClose(); window.open(GITHUB, "_blank", "noopener"); } },
  ];
  const key = q.trim().toLowerCase().replace(/[’]/g, "'").replace(/[!.,]/g, "");
  const list = cmds.filter((c) => c.label.toLowerCase().includes(key));
  const submit = () => {
    if (SECRETS[key]) {
      onClose(); onToast(SECRETS[key]);
      if (key === "sudo hire abdulrahman") setTimeout(() => { location.href = "mailto:" + EMAIL + "?subject=Let's%20talk"; }, 900);
      return;
    }
    if (list[sel]) list[sel].run();
  };
  return html`
    <${Dialog} open=${open} onClose=${onClose} fullWidth maxWidth="sm"
      PaperProps=${{ sx: { bgcolor: C.ink, border: `3px solid ${C.haz}`, borderRadius: 1, m: 2, width: "calc(100% - 32px)", alignSelf: "flex-start", mt: "12vh" } }}>
      <${Box} component="form" onSubmit=${(e) => { e.preventDefault(); submit(); }}
        sx=${{ display: "flex", alignItems: "center", gap: 1.5, px: 2.5, py: 1.75, borderBottom: `2px solid ${alpha(C.haz, 0.4)}` }}>
        <${Typography} sx=${{ fontFamily: mono, color: C.haz, fontWeight: 600 }}>$<//>
        <${InputBase} autoFocus fullWidth placeholder="type a command (some are classified)" value=${q}
          onChange=${(e) => { setQ(e.target.value); setSel(0); }}
          onKeyDown=${(e) => {
            if (e.key === "ArrowDown") { e.preventDefault(); setSel((s) => Math.min(s + 1, list.length - 1)); }
            if (e.key === "ArrowUp") { e.preventDefault(); setSel((s) => Math.max(s - 1, 0)); }
          }}
          inputProps=${{ "aria-label": "Command", autoCapitalize: "none", autoCorrect: "off", spellCheck: false, enterKeyHint: "go" }}
          sx=${{ fontFamily: mono, fontSize: 16, color: C.sand }} />
      <//>
      <${List} dense sx=${{ py: 1, maxHeight: 340, overflowY: "auto" }}>
        ${list.length === 0 && html`<${Typography} sx=${{ px: 3, py: 2, fontFamily: type, fontSize: 15, color: C.muted }}>
          No such command. Press enter anyway. Say my name, maybe.<//>`}
        ${list.map((c, i) => html`
          <${ListItemButton} key=${c.label} selected=${i === sel} onClick=${c.run} onMouseEnter=${() => setSel(i)}
            sx=${{ mx: 1, "&.Mui-selected": { bgcolor: alpha(C.haz, 0.14) } }}>
            <${ListItemText} primary=${c.label} primaryTypographyProps=${{ fontWeight: 600 }} />
            <${Typography} sx=${{ fontFamily: mono, fontSize: 12, color: C.muted }}>${c.hint}<//>
          <//>`)}
      <//>
    <//>`;
}

function CaseClosed({ show }) {
  if (!show) return null;
  return html`
    <${Box} aria-live="polite" sx=${{ position: "fixed", inset: 0, zIndex: 2000, display: "grid", placeItems: "center", pointerEvents: "none", bgcolor: alpha(C.ink, 0.55) }}>
      <${Box} sx=${{ border: `8px solid ${C.stamp}`, color: C.stamp, px: { xs: 3, md: 6 }, py: 1, fontFamily: head, fontSize: { xs: 64, md: 140 }, letterSpacing: ".06em",
        bgcolor: alpha(C.manila, 0.92), animation: "closed 3s ease forwards", textAlign: "center" }}>CASE CLOSED<//>
    <//>`;
}

/* ------------------------------------------------------------------ app */
function App() {
  const [palette, setPalette] = useState(false);
  const [toast, setToast] = useState(null);
  const [closed, setClosed] = useState(false);
  const copy = useCallback(() => {
    const done = () => setToast("Email copied. Now call. Well, email.");
    navigator.clipboard ? navigator.clipboard.writeText(EMAIL).then(done, done) : done();
  }, []);

  useEffect(() => {
    const seq = ["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];
    let pos = 0;
    const onKey = (e) => {
      const tag = (e.target.tagName || "").toLowerCase();
      const k = (e.key || "").toLowerCase();
      if ((k === "/" || (k === "k" && (e.metaKey || e.ctrlKey))) && tag !== "input" && tag !== "textarea") {
        e.preventDefault(); setPalette(true); return;
      }
      pos = k === seq[pos] ? pos + 1 : (k === seq[0] ? 1 : 0);
      if (pos === seq.length) { pos = 0; setClosed(true); setTimeout(() => setClosed(false), 3100); }
    };
    window.addEventListener("keydown", onKey);
    console.log("%cSay my name.%c\nPress / on the page. Some commands are classified.", "color:#F5C518;font:700 20px Impact,sans-serif", "color:#A9A48E;font:13px monospace");
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return html`
    <${ThemeProvider} theme=${theme}>
      <${CssBaseline} />
      <div className="grain" aria-hidden="true"></div>
      <${Nav} onPalette=${() => setPalette(true)} />
      <${Hero} />
      <${Tape} />
      <main>
        <${Lab} />
        <${Cases} />
        <${Record} />
        <${Experiments} />
      </main>
      <${Tape} text="RESTRICTED AREA · AUTHORIZED ENGINEERS ONLY" />
      <${Contact} onCopy=${copy} />
      <${Box} component="footer" sx=${{ py: 4, borderTop: `3px solid ${C.haz}`, bgcolor: C.ink }}>
        <${Container} maxWidth="lg">
          <${Stack} direction=${{ xs: "column", sm: "row" }} justifyContent="space-between" sx=${{ gap: 1 }}>
            <${Typography} sx=${{ fontFamily: type, fontSize: 15, color: C.muted }}>© ${new Date().getFullYear()} Abdulrahman Ahmed · Cairo, Egypt · Remember my name.<//>
            <${Typography} component="button" onClick=${() => setPalette(true)}
              sx=${{ fontFamily: mono, fontSize: 13, color: C.muted, cursor: "pointer", background: "none", border: 0, p: 0, textAlign: "left" }}>
              psst. press <${Box} component="span" sx=${{ color: C.haz, fontWeight: 600 }}>/<//> (or tap here)
            <//>
          <//>
        <//>
      <//>
      <${Palette} open=${palette} onClose=${() => setPalette(false)} onToast=${setToast} onCopy=${copy} />
      <${CaseClosed} show=${closed} />
      <${Snackbar} open=${!!toast} autoHideDuration=${3400} onClose=${() => setToast(null)} anchorOrigin=${{ vertical: "bottom", horizontal: "center" }}>
        <${Alert} severity="info" variant="filled" icon=${false} onClose=${() => setToast(null)}
          sx=${{ bgcolor: C.haz, color: C.ink, border: `3px solid ${C.ink}`, borderRadius: 1, fontFamily: type, fontSize: 15 }}>${toast}<//>
      <//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
